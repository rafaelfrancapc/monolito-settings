[package]
name = "monolito-settings"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-or-later"
description = "Configurações do sistema e desktop para Cinnamon e XFCE"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
glib-build-tools = "0.20"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
