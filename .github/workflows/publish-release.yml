name: Publicar release Debian

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter repositório e tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Identificar release pendente
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          test -n "$release_tag"
          release_asset="monolito-settings_${release_tag#v}_amd64.deb"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "asset=$release_asset" >> "$GITHUB_OUTPUT"
          echo "title=Configurações ${release_tag#v}" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$release_asset"; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências de compilação
        if: steps.release.outputs.pending == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev librsvg2-common

      - name: Compilar pacote da tag
        if: steps.release.outputs.pending == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout --detach "$RELEASE_TAG"
          ./scripts/build-deb.sh dist

      - name: Criar release ou anexar pacote
        if: steps.release.outputs.pending == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body_path: docs/releases/${{ steps.release.outputs.tag }}.md
          files: dist/${{ steps.release.outputs.asset }}
          fail_on_unmatched_files: true
          overwrite_files: true
