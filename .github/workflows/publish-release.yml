name: Publicar release Debian

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter repositório e tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar release pendente
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          test -n "$release_tag"
          release_asset="monolito-settings_${release_tag#v}_amd64.deb"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "asset=$release_asset" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$release_asset"; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências de compilação
        if: steps.release.outputs.pending == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev librsvg2-common

      - name: Compilar pacote da tag
        if: steps.release.outputs.pending == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout --detach "$RELEASE_TAG"
          ./scripts/build-deb.sh dist

      - name: Criar release ou anexar pacote
        if: steps.release.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$RELEASE_ASSET" \
              --verify-tag \
              --title "Configurações ${RELEASE_TAG#v}" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
